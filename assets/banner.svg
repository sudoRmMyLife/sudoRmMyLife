<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Anime night city banner with a glowing LOOMDEV neon sign">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050408"/>
      <stop offset="0.55" stop-color="#0d0a1a"/>
      <stop offset="0.78" stop-color="#1c1338"/>
      <stop offset="1" stop-color="#2a1a4d"/>
    </linearGradient>
    <radialGradient id="moonglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f2ecdc" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#e8e2d2" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#e8e2d2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="horizon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c98d5c" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#c98d5c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="0.5" cy="0.46" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.6"/>
    </radialGradient>
    <filter id="neon" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <style>
      .tw1 { animation: tw 3.2s ease-in-out infinite; }
      .tw2 { animation: tw 4.6s ease-in-out -1.4s infinite; }
      .tw3 { animation: tw 5.8s ease-in-out -2.9s infinite; }
      @keyframes tw { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
      .flick-a { animation: flk 4.2s linear infinite; }
      .flick-b { animation: flk 6.7s linear -2.1s infinite; }
      @keyframes flk { 0%,100% { opacity: .85; } 8% { opacity: .35; } 10% { opacity: .85; } 46% { opacity: .85; } 48% { opacity: .5; } 50% { opacity: .85; } }
      .neonflicker { animation: neon 7s linear infinite; }
      @keyframes neon { 0%,100% { opacity: 1; } 6% { opacity: 1; } 7% { opacity: .35; } 8% { opacity: 1; } 54% { opacity: 1; } 55% { opacity: .55; } 56% { opacity: 1; } 82% { opacity: 1; } 83% { opacity: .7; } 84% { opacity: 1; } }
      .moonpulse { animation: moon 9s ease-in-out infinite; }
      @keyframes moon { 0%,100% { opacity: .92; } 50% { opacity: 1; } }
    </style>
  </defs>

  <!-- sky -->
  <rect x="0" y="0" width="1200" height="420" fill="url(#sky)"/>
  <ellipse cx="330" cy="360" rx="420" ry="150" fill="url(#horizon)"/>

  <!-- stars -->
  <g fill="#cfd6ff">
    <circle class="tw1" cx="60" cy="50" r="1.6"/><circle class="tw2" cx="140" cy="120" r="1.2"/>
    <circle class="tw3" cx="210" cy="60" r="1.8"/><circle class="tw1" cx="290" cy="140" r="1.1"/>
    <circle class="tw2" cx="360" cy="45" r="1.5"/><circle class="tw3" cx="430" cy="110" r="1.2"/>
    <circle class="tw1" cx="500" cy="55" r="1.7"/><circle class="tw2" cx="560" cy="130" r="1.1"/>
    <circle class="tw3" cx="640" cy="48" r="1.5"/><circle class="tw1" cx="700" cy="150" r="1.2"/>
    <circle class="tw2" cx="770" cy="60" r="1.7"/><circle class="tw3" cx="830" cy="130" r="1.1"/>
    <circle class="tw1" cx="1100" cy="55" r="1.6"/><circle class="tw2" cx="1150" cy="150" r="1.2"/>
    <circle class="tw3" cx="1050" cy="200" r="1.3"/><circle class="tw1" cx="180" cy="200" r="1.2"/>
    <circle class="tw2" cx="420" cy="190" r="1.4"/><circle class="tw3" cx="620" cy="210" r="1.1"/>
    <circle class="tw1" cx="880" cy="220" r="1.3"/><circle class="tw2" cx="90" cy="260" r="1.1"/>
    <circle class="tw3" cx="1130" cy="260" r="1.4"/><circle class="tw1" cx="330" cy="230" r="1.2"/>
    <circle class="tw2" cx="540" cy="250" r="1.3"/><circle class="tw3" cx="760" cy="250" r="1.1"/>
  </g>

  <!-- shooting star -->
  <g opacity="0">
    <line x1="0" y1="0" x2="90" y2="-30" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.72;0.78;1" dur="8s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="640 130;640 130;860 60" keyTimes="0;0.72;0.8" dur="8s" repeatCount="indefinite"/>
  </g>

  <!-- moon -->
  <g class="moonpulse">
    <circle cx="950" cy="112" r="118" fill="url(#moonglow)"/>
    <circle cx="950" cy="112" r="62" fill="#e8e3d3"/>
    <circle cx="932" cy="96" r="11" fill="#cfc8b2" opacity="0.8"/>
    <circle cx="962" cy="128" r="15" fill="#cfc8b2" opacity="0.7"/>
    <circle cx="948" cy="88" r="6" fill="#cfc8b2" opacity="0.8"/>
    <circle cx="978" cy="104" r="7" fill="#d8d1bc" opacity="0.8"/>
  </g>

  <!-- drifting clouds -->
  <g fill="#161229" opacity="0.6" filter="url(#soft)">
    <ellipse cx="250" cy="120" rx="150" ry="26"/>
    <ellipse cx="330" cy="138" rx="110" ry="20"/>
    <animateTransform attributeName="transform" type="translate" values="-40 0; 50 0; -40 0" keyTimes="0;0.5;1" dur="34s" repeatCount="indefinite"/>
  </g>
  <g fill="#120f22" opacity="0.55" filter="url(#soft)">
    <ellipse cx="880" cy="200" rx="170" ry="24"/>
    <ellipse cx="790" cy="216" rx="110" ry="18"/>
    <animateTransform attributeName="transform" type="translate" values="40 0; -50 0; 40 0" keyTimes="0;0.5;1" dur="41s" repeatCount="indefinite"/>
  </g>

  <!-- mountains -->
  <path d="M0 340 L120 260 L210 320 L330 250 L450 330 L580 270 L700 335 L830 265 L960 330 L1080 275 L1200 335 L1200 420 L0 420 Z" fill="#0a0812"/>

  <!-- city back layer -->
  <g fill="#100e1e">
    <rect x="20" y="330" width="70" height="90"/><rect x="110" y="310" width="55" height="110"/>
    <rect x="185" y="335" width="80" height="85"/><rect x="285" y="315" width="60" height="105"/>
    <rect x="365" y="340" width="75" height="80"/><rect x="470" y="320" width="58" height="100"/>
    <rect x="548" y="338" width="82" height="82"/><rect x="655" y="312" width="62" height="108"/>
    <rect x="740" y="336" width="78" height="84"/><rect x="840" y="318" width="60" height="102"/>
    <rect x="925" y="340" width="72" height="80"/><rect x="1020" y="322" width="58" height="98"/>
    <rect x="1100" y="338" width="80" height="82"/>
  </g>

  <!-- city front layer -->
  <g fill="#0b0a15">
    <rect x="0" y="350" width="95" height="70"/><rect x="150" y="335" width="70" height="85"/>
    <rect x="255" y="200" width="120" height="220"/>
    <rect x="410" y="350" width="80" height="70"/><rect x="520" y="340" width="66" height="80"/>
    <rect x="620" y="355" width="90" height="65"/><rect x="745" y="345" width="70" height="75"/>
    <rect x="850" y="355" width="86" height="65"/><rect x="970" y="348" width="70" height="72"/>
    <rect x="1075" y="358" width="125" height="62"/>
  </g>

  <!-- lit windows -->
  <g>
    <g fill="#ffd479" opacity="0.85">
      <rect x="268" y="220" width="9" height="12"/><rect x="286" y="220" width="9" height="12"/>
      <rect x="322" y="244" width="9" height="12"/><rect x="268" y="268" width="9" height="12"/>
      <rect x="304" y="292" width="9" height="12"/><rect x="340" y="316" width="9" height="12"/>
      <rect x="532" y="352" width="8" height="10"/><rect x="758" y="358" width="8" height="10"/>
      <rect x="862" y="368" width="8" height="10"/><rect x="1090" y="370" width="8" height="10"/>
      <rect x="162" y="348" width="8" height="10"/>
    </g>
    <g fill="#9fd8ff" opacity="0.75">
      <rect x="304" y="220" width="9" height="12"/><rect x="340" y="244" width="9" height="12"/>
      <rect x="286" y="268" width="9" height="12"/><rect x="322" y="292" width="9" height="12"/>
      <rect x="268" y="316" width="9" height="12"/><rect x="548" y="352" width="8" height="10"/>
      <rect x="774" y="358" width="8" height="10"/><rect x="982" y="360" width="8" height="10"/>
    </g>
    <rect class="flick-a" x="340" y="268" width="9" height="12" fill="#ffd479"/>
    <rect class="flick-b" x="286" y="316" width="9" height="12" fill="#9fd8ff"/>
    <rect class="flick-a" x="632" y="368" width="8" height="10" fill="#ffd479"/>
  </g>

  <!-- neon sign -->
  <g filter="url(#neon)">
    <rect x="252" y="196" width="126" height="2" fill="#e8b183" opacity="0.8"/>
    <text x="315" y="252" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="34" font-weight="bold" letter-spacing="3" fill="#e8b183" class="neonflicker">LOOMDEV</text>
  </g>

  <!-- rain -->
  <g stroke="#8fa3c8" stroke-width="2" stroke-linecap="round" opacity="0.22">
    <g stroke-dasharray="16 484">
      <line x1="80" y1="-20" x2="72" y2="480"/><line x1="180" y1="-20" x2="172" y2="480"/>
      <line x1="280" y1="-20" x2="272" y2="480"/><line x1="380" y1="-20" x2="372" y2="480"/>
      <line x1="480" y1="-20" x2="472" y2="480"/><line x1="580" y1="-20" x2="572" y2="480"/>
      <line x1="680" y1="-20" x2="672" y2="480"/><line x1="780" y1="-20" x2="772" y2="480"/>
      <line x1="880" y1="-20" x2="872" y2="480"/><line x1="980" y1="-20" x2="972" y2="480"/>
      <line x1="1080" y1="-20" x2="1072" y2="480"/><line x1="1180" y1="-20" x2="1172" y2="480"/>
      <animate attributeName="stroke-dashoffset" from="0" to="500" dur="1.1s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- vertical katakana -->
  <text x="64" y="70" font-family="sans-serif" font-size="24" letter-spacing="8" fill="#5a5478" opacity="0.9">
    <tspan x="64" dy="0">ポ</tspan><tspan x="64" dy="36">ー</tspan><tspan x="64" dy="36">ト</tspan><tspan x="64" dy="36">フ</tspan><tspan x="64" dy="36">ォ</tspan><tspan x="64" dy="36">リ</tspan><tspan x="64" dy="36">オ</tspan>
  </text>

  <!-- ground + vignette -->
  <rect x="0" y="404" width="1200" height="16" fill="#060509"/>
  <rect x="0" y="0" width="1200" height="420" fill="url(#vig)"/>
</svg>
